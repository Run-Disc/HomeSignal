name: Windows desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "HomeSignal-Setup.exe"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone app and Windows installer
        run: npm run desktop:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload HomeSignal-Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: HomeSignal-Setup
          path: dist-desktop/HomeSignal-Setup.exe
          if-no-files-found: error

      - name: Commit installer to the repository root
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cp dist-desktop/HomeSignal-Setup.exe HomeSignal-Setup.exe
          git add HomeSignal-Setup.exe
          if git diff --cached --quiet; then
            echo "Installer unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update HomeSignal-Setup.exe for repository ZIP downloads"
          git push

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/HomeSignal-Setup.exe
          fail_on_unmatched_files: true
