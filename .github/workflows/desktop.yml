name: Desktop packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build unsigned Windows installer
        run: npm run desktop:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v5
        with:
          name: HomeSignal-windows-x64
          path: dist-desktop/HomeSignal-Setup.exe
          if-no-files-found: error
      - name: Attach Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-desktop/HomeSignal-Setup.exe
          fail_on_unmatched_files: true

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build unsigned macOS DMG and ZIP
        run: npm run desktop:mac:${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v5
        with:
          name: HomeSignal-macos-${{ matrix.arch }}
          path: |
            dist-desktop/HomeSignal-mac-${{ matrix.arch }}.dmg
            dist-desktop/HomeSignal-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
      - name: Attach macOS packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/HomeSignal-mac-${{ matrix.arch }}.dmg
            dist-desktop/HomeSignal-mac-${{ matrix.arch }}.zip
          fail_on_unmatched_files: true
